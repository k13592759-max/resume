<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0A0C14" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#grad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Stylized Monogram K with Neural Nodes -->
  <path d="M22 18V46M22 32L38 18M28 27L42 46" stroke="url(#grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <circle cx="22" cy="18" r="3" fill="#38BDF8" />
  <circle cx="22" cy="46" r="3" fill="#818CF8" />
  <circle cx="38" cy="18" r="3" fill="#C084FC" />
  <circle cx="42" cy="46" r="3" fill="#38BDF8" />
  <circle cx="22" cy="32" r="3" fill="#FFFFFF" />
</svg>