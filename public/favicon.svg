<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="emeraldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Obsidian Octagonal Container -->
  <rect width="64" height="64" rx="16" fill="#030708" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#emeraldCyanGrad)" stroke-width="1.5" stroke-opacity="0.45" />
  
  <!-- Outer Cyber Diamond Ring -->
  <polygon points="32,6 58,32 32,58 6,32" stroke="url(#emeraldCyanGrad)" stroke-width="1" stroke-opacity="0.25" fill="none" />
  
  <!-- Stylized Geometric Crystalline 'K' -->
  <path d="M22 16V48M22 32L38 16M27 27L42 48" stroke="url(#emeraldCyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)" />
  
  <!-- Luminous Nodes -->
  <circle cx="22" cy="16" r="3" fill="#10B981" />
  <circle cx="22" cy="48" r="3" fill="#06B6D4" />
  <circle cx="38" cy="16" r="3" fill="#34D399" />
  <circle cx="42" cy="48" r="3" fill="#22D3EE" />
  <circle cx="22" cy="32" r="3" fill="#FFFFFF" />
</svg>
